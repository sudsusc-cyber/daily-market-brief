name: dump-thesis-state

# 一次性诊断工具:从 daily-state 缓存中导出 thesis 状态/证据文件,
# 供本地查看。不发邮件、不写 cache、不影响 daily.yml 主路径。
on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read   # restore cache 需要

concurrency:
  group: dump-thesis-state
  cancel-in-progress: true

jobs:
  dump:
    name: export thesis state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Restore latest daily-state cache (read-only)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: state
          key: dump-state-never-match-${{ github.run_id }}
          restore-keys: |
            daily-state-

      - name: Inspect state directory
        run: |
          echo "=== state/ contents ==="
          ls -la state/ || true
          echo "=== thesis_state.json ==="
          wc -c state/thesis_state.json 2>/dev/null || echo "(missing)"
          echo "=== thesis_evidence_2026.jsonl ==="
          wc -l state/thesis_evidence_2026.jsonl 2>/dev/null || echo "(missing)"

      - name: Upload thesis state + evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thesis-state-dump
          path: |
            state/thesis_state.json
            state/thesis_evidence_2026.jsonl
          if-no-files-found: warn
          retention-days: 7
