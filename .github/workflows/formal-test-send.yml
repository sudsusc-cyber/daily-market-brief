name: send-formal-test

# 手动定向试发完整正式版：运行真实采集、LLM、主题与正式模板，但不恢复或保存
# daily-state，因此不会污染定时邮件的新闻去重、主题缓存或判断账本。
# 仅恢复/保存独立估值状态；实时取数失败保留有日期的历史值，不触及新闻去重。
on:
  workflow_dispatch:
    inputs:
      recipients:
        description: "试发收件人（多个地址用英文逗号分隔）"
        required: true
        type: string
      qqqm_check_only:
        description: "Only verify QQQM live inputs; do not send email"
        required: false
        default: false
        type: boolean
      qqqm_verified_seed:
        description: "Optional independently verified QQQM source JSON for initial cache"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: send-formal-test
  cancel-in-progress: false

jobs:
  send:
    if: github.ref == 'refs/heads/main'
    name: collect + render + send formal test
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_SEND: "true"
      PYTHONPATH: .
      DELIVERY_RECEIPT_PATH: ${{ github.workspace }}/.delivery-receipt.json
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
      # 试发必须与正式定时任务使用同一套内在价值开关，避免预览路径漏掉新列。
      VALUATION_ENABLED: ${{ vars.VALUATION_ENABLED || 'false' }}
      MORNINGSTAR_FAIR_VALUE_ENABLED: ${{ vars.MORNINGSTAR_FAIR_VALUE_ENABLED || 'false' }}
      QQQM_DAILY_FORWARD_ENABLED: ${{ vars.QQQM_DAILY_FORWARD_ENABLED || 'true' }}

    steps:
      - name: Set LLM cutoff before setup
        run: echo "BRIEF_LLM_CUTOFF_EPOCH=$(( $(date +%s) + 17 * 60 ))" >> "$GITHUB_ENV"

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Morningstar report OCR
        if: ${{ !inputs.qqqm_check_only }}
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Restore verified Morningstar snapshot only
        if: ${{ !inputs.qqqm_check_only }}
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: state/morningstar_fair_values.json
          key: morningstar-verified-read-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            morningstar-verified-

      - name: Merge Morningstar startup and runtime history
        if: ${{ !inputs.qqqm_check_only }}
        run: uv run python -m scripts.morningstar_cache normalize

      - name: Restore isolated Pop Mart analyst target
        if: ${{ !inputs.qqqm_check_only }}
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: state/pop_mart_analyst_recovery.json
          key: pop-mart-target-read-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pop-mart-target-

      - name: Merge verified Pop Mart target history
        if: ${{ !inputs.qqqm_check_only }}
        run: uv run python -m scripts.pop_mart_cache

      - name: Restore verified QQQM snapshot only
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: state/qqqm_valuation.json
          key: qqqm-verified-read-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            qqqm-verified-

      - name: Install independently verified QQQM startup snapshot
        if: ${{ inputs.qqqm_verified_seed != '' }}
        run: uv run python scripts/seed_qqqm.py
        env:
          QQQM_VERIFIED_SEED: ${{ inputs.qqqm_verified_seed }}

      - name: Clear previous Pop Mart source diagnostic
        run: rm -f state/pop_mart_source_diagnostic.json

      - name: Send formal test email
        if: ${{ !inputs.qqqm_check_only }}
        run: uv run python src/main.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          QQ_EMAIL_ADDRESS: ${{ secrets.QQ_EMAIL_ADDRESS }}
          QQ_EMAIL_AUTH_CODE: ${{ secrets.QQ_EMAIL_AUTH_CODE }}
          EMAIL_RECIPIENT: ${{ inputs.recipients }}

      - name: Verify QQQM without sending
        if: ${{ inputs.qqqm_check_only }}
        run: uv run python scripts/check_qqqm.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Upload QQQM diagnostic
        if: ${{ always() && inputs.qqqm_check_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qqqm-diagnostic
          path: state/qqqm_diagnostic.json
          retention-days: 3

      - name: Upload QQQM calculation audit
        if: ${{ always() && hashFiles('state/qqqm_calculation_audit.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qqqm-calculation-audit
          path: state/qqqm_calculation_audit.json
          retention-days: 30

      - name: Upload Morningstar source decisions
        if: ${{ always() && !inputs.qqqm_check_only && hashFiles('state/morningstar_diagnostic.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: morningstar-source-decisions
          path: state/morningstar_diagnostic.json
          retention-days: 30

      - name: Upload Pop Mart source decisions
        if: ${{ always() && !inputs.qqqm_check_only && hashFiles('state/pop_mart_source_diagnostic.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pop-mart-source-decisions
          path: state/pop_mart_source_diagnostic.json
          retention-days: 30

      - name: Save verified Morningstar history
        if: ${{ always() && !inputs.qqqm_check_only && github.ref == 'refs/heads/main' && hashFiles('.delivery-receipt.json') != '' && hashFiles('state/morningstar_fair_values.json') != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: state/morningstar_fair_values.json
          key: morningstar-verified-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save isolated Pop Mart analyst target
        if: ${{ always() && !inputs.qqqm_check_only && github.ref == 'refs/heads/main' && hashFiles('.delivery-receipt.json') != '' && hashFiles('state/pop_mart_analyst_recovery.json') != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: state/pop_mart_analyst_recovery.json
          key: pop-mart-target-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Confirm SMTP acceptance
        if: ${{ always() && !inputs.qqqm_check_only && hashFiles('.delivery-receipt.json') != '' }}
        run: uv run python -m src.utils.delivery accepted .delivery-receipt.json

      - name: Confirm full email delivery
        if: ${{ always() && !inputs.qqqm_check_only && hashFiles('.delivery-receipt.json') != '' }}
        run: uv run python -m src.utils.delivery full .delivery-receipt.json

      - name: Validate QQQM snapshot before saving
        id: qqqm-cache
        if: ${{ success() }}
        run: uv run python -m scripts.qqqm_cache normalize

      - name: Save verified QQQM snapshot
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.qqqm-cache.outputs.valid == 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: state/qqqm_valuation.json
          key: qqqm-verified-${{ github.run_id }}-${{ github.run_attempt }}
