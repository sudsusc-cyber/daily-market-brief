name: monitor-daily-brief

# 监控:每日 BJT 8:30 检查 daily.yml 是否有今日 run。
#   - 主触发:cron-job.org 调 workflow_dispatch(秒级精度)
#   - 兜底:GH schedule(BJT 8:30 周二-周六,可能延迟)
# 检查不通过 → 发告警邮件给收件人。

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * 2-6"   # UTC 0:30 = BJT 8:30 周二-周六

# 与 daily.yml 风格对齐:防止 cron-job.org + GH schedule 几乎同秒触发时双跑监控,
# 双发告警邮件;不取消进行中的(发告警不可中断)。
concurrency:
  group: monitor-daily-brief
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # 查询 daily.yml 的 workflow runs 必需

jobs:
  check:
    name: verify daily delivery
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_REPO:             ${{ github.repository }}
      GH_RUN_ID:           ${{ github.run_id }}
      MONITOR_ALERT_PATH:  ${{ github.workspace }}/.monitor-alert.txt
      PYTHONPATH:          .
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check daily delivery
        run: uv run python scripts/monitor.py --check-only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send monitor alert
        if: ${{ hashFiles('.monitor-alert.txt') != '' }}
        run: uv run python scripts/monitor.py --send-request
        env:
          QQ_EMAIL_ADDRESS: ${{ secrets.QQ_EMAIL_ADDRESS }}
          QQ_EMAIL_AUTH_CODE: ${{ secrets.QQ_EMAIL_AUTH_CODE }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
