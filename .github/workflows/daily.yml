name: daily-market-brief

# schedule re-registered 2026-05-02:首次触发未生效,push 触发 GH 重新读取 cron
# cron 调度(详见 docs/decisions/0007-m6-cron-schedule.md):
#   主时间:UTC 周一-五 23:07 = 北京周二-六 07:07
#   备用:UTC 周一-五 23:23 = 北京周二-六 07:23(主时间被 GH skip 时兜底)
#   双触发幂等性:main.py 启动时通过 GH API 查询当日是否已成功发过,已发则
#               exit(0)。GITHUB_TOKEN 由 Actions 自动注入,无需配置。
#   美股节假日由 main.py 启动时 should_send_today() 跳过(直接 exit 0)
on:
  schedule:
    - cron: "7 23 * * 1-5"
    - cron: "23 23 * * 1-5"
    # 临时测试 cron(2026-05-02):验证 GH schedule 是否准点触发,
    # 跑一次后立刻删除。北京 8:22 = UTC 0:22,每天触发(不限工作日)。
    - cron: "22 0 * * *"
  # 手动触发(调试用):Actions 页面 → Run workflow
  workflow_dispatch:
    inputs:
      force_send:
        description: "FORCE_SEND=1 跳过节假日预检"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  send:
    name: collect + render + send
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      FINNHUB_API_KEY:  ${{ secrets.FINNHUB_API_KEY }}
      FRED_API_KEY:     ${{ secrets.FRED_API_KEY }}
      QQ_EMAIL_ADDRESS: ${{ secrets.QQ_EMAIL_ADDRESS }}
      QQ_EMAIL_AUTH_CODE: ${{ secrets.QQ_EMAIL_AUTH_CODE }}
      EMAIL_RECIPIENT:  ${{ secrets.EMAIL_RECIPIENT }}
      FORCE_SEND:       ${{ github.event.inputs.force_send || '0' }}
      PYTHONPATH:       .
      # GH 自动注入,用于双触发幂等性查询(已发过就跳过)
      GH_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
      GH_REPO:            ${{ github.repository }}
      GH_RUN_ID:          ${{ github.run_id }}
      GH_EVENT_NAME:      ${{ github.event_name }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Send daily market brief
        run: uv run python src/main.py
