name: daily-market-brief

# cron 调度(详见 docs/decisions/0007-m6-cron-schedule.md):
#   生产三冗余触发(对抗 GH schedule 30-50 分钟延迟):
#     主时间:UTC 22:30 = 北京 6:30(留 30 分钟余量,延迟后仍 7:00 前到)
#     兜底1:UTC 23:00 = 北京 7:00
#     兜底2:UTC 23:30 = 北京 7:30
#   幂等性:main.py 启动时通过 GH API 查询当日是否已成功发过,先成功的发,
#         后续 cron 自动 exit 0。GITHUB_TOKEN 由 Actions 自动注入。
#   美股节假日由 main.py 启动时 should_send_today() 跳过(直接 exit 0)
#
#   临时测试 cron(2026-05-02):2 个,验证今日 9:00/9:15 BJT 能否自动触发,
#   测试完毕立刻通过另一 PR 删除。
on:
  schedule:
    - cron: "30 22 * * 1-5"
    - cron: "0 23 * * 1-5"
    - cron: "30 23 * * 1-5"
    - cron: "0 1 * * *"
    - cron: "15 1 * * *"
  # 手动触发(调试用):Actions 页面 → Run workflow
  workflow_dispatch:
    inputs:
      force_send:
        description: "FORCE_SEND=1 跳过节假日预检"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  send:
    name: collect + render + send
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      FINNHUB_API_KEY:  ${{ secrets.FINNHUB_API_KEY }}
      FRED_API_KEY:     ${{ secrets.FRED_API_KEY }}
      QQ_EMAIL_ADDRESS: ${{ secrets.QQ_EMAIL_ADDRESS }}
      QQ_EMAIL_AUTH_CODE: ${{ secrets.QQ_EMAIL_AUTH_CODE }}
      EMAIL_RECIPIENT:  ${{ secrets.EMAIL_RECIPIENT }}
      FORCE_SEND:       ${{ github.event.inputs.force_send || '0' }}
      PYTHONPATH:       .
      # GH 自动注入,用于双触发幂等性查询(已发过就跳过)
      GH_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
      GH_REPO:            ${{ github.repository }}
      GH_RUN_ID:          ${{ github.run_id }}
      GH_EVENT_NAME:      ${{ github.event_name }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Send daily market brief
        run: uv run python src/main.py
