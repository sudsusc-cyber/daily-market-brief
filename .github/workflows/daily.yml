name: daily-market-brief

# cron 调度(详见 docs/decisions/0007-m6-cron-schedule.md):
#   UTC 周一-周五 23:07 = 北京周二-周六 07:07
#   错峰原因:UTC 00:00 整点是 GitHub Actions 流量高峰,容易被官方 skip/delay,
#           偏移 7 分钟显著降低跳过概率(用户要求时间提前到 7 点)
#   美股节假日由 main.py 启动时 should_send_today() 跳过(直接 exit 0)
on:
  schedule:
    - cron: "7 23 * * 1-5"
  # 手动触发(调试用):Actions 页面 → Run workflow
  workflow_dispatch:
    inputs:
      force_send:
        description: "FORCE_SEND=1 跳过节假日预检"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  send:
    name: collect + render + send
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      FINNHUB_API_KEY:  ${{ secrets.FINNHUB_API_KEY }}
      FRED_API_KEY:     ${{ secrets.FRED_API_KEY }}
      QQ_EMAIL_ADDRESS: ${{ secrets.QQ_EMAIL_ADDRESS }}
      QQ_EMAIL_AUTH_CODE: ${{ secrets.QQ_EMAIL_AUTH_CODE }}
      EMAIL_RECIPIENT:  ${{ secrets.EMAIL_RECIPIENT }}
      FORCE_SEND:       ${{ github.event.inputs.force_send || '0' }}
      PYTHONPATH:       .

    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Send daily market brief
        run: uv run python src/main.py
