name: daily-market-brief

# 触发策略(详见 docs/decisions/0007-m6-cron-schedule.md):
#   主触发:外部 cron-job.org 调 GitHub workflow_dispatch API(秒级精度)
#   兜底:GH schedule(不可靠,延迟 30-50 分钟常态)— 仅当外部触发器宕机时起作用
#   幂等性:main.py 启动时通过 GH API 查询当日是否已成功发过,先成功的发,
#         后续触发自动 exit 0。GITHUB_TOKEN 由 Actions 自动注入。
#   美股节假日由 main.py 启动时 should_send_today() 跳过(直接 exit 0)
on:
  schedule:
    # 兜底 cron(UTC Mon-Fri 22:30 = BJT Tue-Sat 06:30,美股 Mon-Fri 收盘后)
    # 不依赖准点,只防外部触发器全挂;monitor.yml 的 "30 0 * * 2-6" 与此对齐(BJT Tue-Sat 08:30)
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      force_send:
        description: "Force send even if already sent (true/false)"
        required: false
        default: "false"
      recipient_override:
        description: "Manual-run recipient override (single address; blank uses production recipients)"
        required: false
        default: ""

# 防止 cron-job.org 与 GH schedule 兜底几乎同秒触发时双跑挤压幂等窗口。
# 不取消正在跑的(发邮件 ≠ 可取消的纯计算),只串行化新触发。
concurrency:
  group: daily-market-brief
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # idempotency.already_sent_today() 查 /actions/runs 必需

jobs:
  send:
    name: collect + render + send
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_SEND:       ${{ github.event.inputs.force_send || 'false' }}
      PYTHONPATH:       .
      GH_REPO:            ${{ github.repository }}
      GH_RUN_ID:          ${{ github.run_id }}
      GH_EVENT_NAME:      ${{ github.event_name }}
      DELIVERY_RECEIPT_PATH: ${{ github.workspace }}/.delivery-receipt.json
      QUALITY_ALERT_PATH: ${{ github.workspace }}/.quality-alert.txt
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
      # 底稿齐备、双重官方源核验与 QQ/微信视觉验收后才由仓库变量开启。
      VALUATION_ENABLED: ${{ vars.VALUATION_ENABLED || 'false' }}
      # 无需登录的 Morningstar 公开研究链路；独立开关便于先验收再替换价值栏。
      MORNINGSTAR_FAIR_VALUE_ENABLED: ${{ vars.MORNINGSTAR_FAIR_VALUE_ENABLED || 'false' }}
      QQQM_DAILY_FORWARD_ENABLED: ${{ vars.QQQM_DAILY_FORWARD_ENABLED || 'true' }}

    steps:
      # Stop initiating LLM work by minute 17, leaving a 3-minute target reserve
      # for rendering, SMTP and state receipts; includes dependency setup time.
      - name: Set LLM cutoff before setup
        run: echo "BRIEF_LLM_CUTOFF_EPOCH=$(( $(date +%s) + 17 * 60 ))" >> "$GITHUB_ENV"

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.28"
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Morningstar report OCR
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends tesseract-ocr

      # GH runner 每次 fresh checkout,state 不持久化:
      #   - state/pushed_figures.json     (figures 7 天去重)
      #   - state/last_13f.json           (Berkshire 13F 提交比对)
      #   - state/subject_cache.json      (主题日内幂等缓存)
      #   - state/subject_generation.log  (主题生成审计日志)
      #   - state/header_cache/           (刊头图本地缓存,避免 Pexels 重复请求)
      # 用 actions/cache 把 state/ 跨 run 持久化。
      # cache key 用 run_id 唯一(每次 save 都成功),restore-keys 用前缀回退到最近一次。
      - name: Restore state from previous run
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: state-restore
        with:
          path: |
            state
          key: daily-state-${{ github.run_id }}
          restore-keys: |
            daily-state-

      - name: Preserve daily QQQM snapshot before independent recovery
        run: uv run python -m scripts.qqqm_cache preserve

      - name: Restore independent QQQM snapshot
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: state/qqqm_valuation.json
          key: qqqm-verified-read-${{ github.run_id }}
          restore-keys: |
            qqqm-verified-

      - name: Send daily market brief
        run: uv run python src/main.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          QQ_EMAIL_ADDRESS: ${{ secrets.QQ_EMAIL_ADDRESS }}
          QQ_EMAIL_AUTH_CODE: ${{ secrets.QQ_EMAIL_AUTH_CODE }}
          # 仅 workflow_dispatch 可传 recipient_override；schedule 事件没有该输入，
          # 因而自动回落到生产收件人 secret，不改变每天定时发送行为。
          EMAIL_RECIPIENT: ${{ github.event.inputs.recipient_override || secrets.EMAIL_RECIPIENT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 邮件仍使用受控占位语发送，但在 Actions 页面明确标注内容质量降级。
      # 此步骤不报红，避免双 cron 幂等检查误判后重复发送。
      - name: Report content quality warning
        if: ${{ hashFiles('.quality-alert.txt') != '' }}
        shell: bash
        run: |
          quality_alert="$(tr '\n' ' ' < .quality-alert.txt)"
          echo "::warning title=Daily brief content quality::$quality_alert"
          {
            echo "### Content quality warning"
            echo
            sed 's/^/- /' .quality-alert.txt
          } >> "$GITHUB_STEP_SUMMARY"

      # main.py 仅在至少一位收件人被 SMTP 接受后创建凭证。
      - name: Confirm SMTP acceptance
        if: ${{ hashFiles('.delivery-receipt.json') != '' }}
        run: uv run python -m src.utils.delivery accepted .delivery-receipt.json

      # 部分拒收不能静默标绿；该步骤失败后 job 报红，monitor 也会告警。
      # idempotency 会识别前一步已有 SMTP acceptance，避免兜底 run 重发给已收件人。
      - name: Confirm full email delivery
        if: ${{ hashFiles('.delivery-receipt.json') != '' }}
        run: uv run python -m src.utils.delivery full .delivery-receipt.json

      - name: Validate QQQM snapshot before saving
        id: qqqm-cache
        if: ${{ always() && hashFiles('.delivery-receipt.json') != '' }}
        run: uv run python -m scripts.qqqm_cache normalize

      # 仅至少一位收件人被接受后保存 state；follower/节假日无 receipt，不再写冗余 cache。
      - name: Save state for next run
        if: ${{ always() && hashFiles('.delivery-receipt.json') != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            state
          key: daily-state-${{ github.run_id }}

      # 单独保存已核验估值；定向试发可以只读使用，不接触新闻/主题去重状态。
      - name: Save verified Morningstar snapshot
        if: ${{ always() && github.ref == 'refs/heads/main' && hashFiles('.delivery-receipt.json') != '' && hashFiles('state/morningstar_fair_values.json') != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: state/morningstar_fair_values.json
          key: morningstar-verified-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save verified QQQM snapshot
        if: ${{ always() && github.ref == 'refs/heads/main' && hashFiles('.delivery-receipt.json') != '' && steps.qqqm-cache.outputs.valid == 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: state/qqqm_valuation.json
          key: qqqm-verified-${{ github.run_id }}-${{ github.run_attempt }}
