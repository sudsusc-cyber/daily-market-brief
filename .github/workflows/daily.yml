name: daily-market-brief

# 触发策略(详见 docs/decisions/0007-m6-cron-schedule.md):
#   主触发:外部 cron-job.org 调 GitHub workflow_dispatch API(秒级精度)
#   兜底:GH schedule(不可靠,延迟 30-50 分钟常态)— 仅当外部触发器宕机时起作用
#   幂等性:main.py 启动时通过 GH API 查询当日是否已成功发过,先成功的发,
#         后续触发自动 exit 0。GITHUB_TOKEN 由 Actions 自动注入。
#   美股节假日由 main.py 启动时 should_send_today() 跳过(直接 exit 0)
on:
  schedule:
    # 兜底 cron(UTC Mon-Fri 22:30 = BJT Tue-Sat 06:30,美股 Mon-Fri 收盘后)
    # 不依赖准点,只防外部触发器全挂;monitor.yml 的 "30 0 * * 2-6" 与此对齐(BJT Tue-Sat 08:30)
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      force_send:
        description: "Force send even if already sent (true/false)"
        required: false
        default: "false"

# 防止 cron-job.org 与 GH schedule 兜底几乎同秒触发时双跑挤压幂等窗口。
# 不取消正在跑的(发邮件 ≠ 可取消的纯计算),只串行化新触发。
concurrency:
  group: daily-market-brief
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # idempotency.already_sent_today() 查 /actions/runs 必需

jobs:
  send:
    name: collect + render + send
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_SEND:       ${{ github.event.inputs.force_send || 'false' }}
      PYTHONPATH:       .
      GH_REPO:            ${{ github.repository }}
      GH_RUN_ID:          ${{ github.run_id }}
      GH_EVENT_NAME:      ${{ github.event_name }}
      DELIVERY_RECEIPT_PATH: ${{ github.workspace }}/.delivery-receipt.json

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.28"
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      # GH runner 每次 fresh checkout,state 不持久化:
      #   - state/pushed_figures.json     (figures 7 天去重)
      #   - state/last_13f.json           (Berkshire 13F 提交比对)
      #   - state/subject_cache.json      (主题日内幂等缓存)
      #   - state/subject_generation.log  (主题生成审计日志)
      #   - state/header_cache/           (刊头图本地缓存,避免 Pexels 重复请求)
      # 用 actions/cache 把 state/ 跨 run 持久化。
      # cache key 用 run_id 唯一(每次 save 都成功),restore-keys 用前缀回退到最近一次。
      - name: Restore state from previous run
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: state-restore
        with:
          path: |
            state
          key: daily-state-${{ github.run_id }}
          restore-keys: |
            daily-state-

      - name: Send daily market brief
        run: uv run python src/main.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          QQ_EMAIL_ADDRESS: ${{ secrets.QQ_EMAIL_ADDRESS }}
          QQ_EMAIL_AUTH_CODE: ${{ secrets.QQ_EMAIL_AUTH_CODE }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # main.py 仅在至少一位收件人被 SMTP 接受后创建凭证。
      - name: Confirm SMTP acceptance
        if: ${{ hashFiles('.delivery-receipt.json') != '' }}
        run: uv run python -m src.utils.delivery accepted .delivery-receipt.json

      # 部分拒收不能静默标绿；该步骤失败后 job 报红，monitor 也会告警。
      # idempotency 会识别前一步已有 SMTP acceptance，避免兜底 run 重发给已收件人。
      - name: Confirm full email delivery
        if: ${{ hashFiles('.delivery-receipt.json') != '' }}
        run: uv run python -m src.utils.delivery full .delivery-receipt.json

      # 仅至少一位收件人被接受后保存 state；follower/节假日无 receipt，不再写冗余 cache。
      - name: Save state for next run
        if: ${{ always() && hashFiles('.delivery-receipt.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            state
          key: daily-state-${{ github.run_id }}
