name: daily-market-brief

# 触发策略(详见 docs/decisions/0007-m6-cron-schedule.md):
#   主触发:外部 cron-job.org 调 GitHub workflow_dispatch API(秒级精度)
#   兜底:GH schedule(不可靠,延迟 30-50 分钟常态)— 仅当外部触发器宕机时起作用
#   幂等性:main.py 启动时通过 GH API 查询当日是否已成功发过,先成功的发,
#         后续触发自动 exit 0。GITHUB_TOKEN 由 Actions 自动注入。
#   美股节假日由 main.py 启动时 should_send_today() 跳过(直接 exit 0)
on:
  schedule:
    # 兜底 cron(BJT 6:30 工作日)— 不依赖准点,只防外部触发器全挂
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      force_send:
        description: "Force send even if already sent (true/false)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  send:
    name: collect + render + send
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      FINNHUB_API_KEY:  ${{ secrets.FINNHUB_API_KEY }}
      FRED_API_KEY:     ${{ secrets.FRED_API_KEY }}
      QQ_EMAIL_ADDRESS: ${{ secrets.QQ_EMAIL_ADDRESS }}
      QQ_EMAIL_AUTH_CODE: ${{ secrets.QQ_EMAIL_AUTH_CODE }}
      EMAIL_RECIPIENT:  ${{ secrets.EMAIL_RECIPIENT }}
      FORCE_SEND:       ${{ github.event.inputs.force_send || 'false' }}
      PYTHONPATH:       .
      # GH 自动注入,用于双触发幂等性查询(已发过就跳过)
      GH_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
      GH_REPO:            ${{ github.repository }}
      GH_RUN_ID:          ${{ github.run_id }}
      GH_EVENT_NAME:      ${{ github.event_name }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Send daily market brief
        run: uv run python src/main.py
