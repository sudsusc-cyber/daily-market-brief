name: daily-market-brief

# 触发策略(详见 docs/decisions/0007-m6-cron-schedule.md):
#   主触发:外部 cron-job.org 调 GitHub workflow_dispatch API(秒级精度)
#   兜底:GH schedule(不可靠,延迟 30-50 分钟常态)— 仅当外部触发器宕机时起作用
#   幂等性:main.py 启动时通过 GH API 查询当日是否已成功发过,先成功的发,
#         后续触发自动 exit 0。GITHUB_TOKEN 由 Actions 自动注入。
#   美股节假日由 main.py 启动时 should_send_today() 跳过(直接 exit 0)
on:
  schedule:
    # 兜底 cron(BJT 6:30 工作日)— 不依赖准点,只防外部触发器全挂
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      force_send:
        description: "Force send even if already sent (true/false)"
        required: false
        default: "false"

permissions:
  contents: read
  actions: read   # idempotency.already_sent_today() 查 /actions/runs 必需

jobs:
  send:
    name: collect + render + send
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      FINNHUB_API_KEY:  ${{ secrets.FINNHUB_API_KEY }}
      FRED_API_KEY:     ${{ secrets.FRED_API_KEY }}
      QQ_EMAIL_ADDRESS: ${{ secrets.QQ_EMAIL_ADDRESS }}
      QQ_EMAIL_AUTH_CODE: ${{ secrets.QQ_EMAIL_AUTH_CODE }}
      EMAIL_RECIPIENT:  ${{ secrets.EMAIL_RECIPIENT }}
      DUAN_USER_ID:     ${{ secrets.DUAN_USER_ID }}
      XQ_A_TOKEN:       ${{ secrets.XQ_A_TOKEN }}
      FORCE_SEND:       ${{ github.event.inputs.force_send || 'false' }}
      PYTHONPATH:       .
      # GH 自动注入,用于双触发幂等性查询(已发过就跳过)
      GH_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
      GH_REPO:            ${{ github.repository }}
      GH_RUN_ID:          ${{ github.run_id }}
      GH_EVENT_NAME:      ${{ github.event_name }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # GH runner 每次 fresh checkout,state 不持久化:
      #   - state/pushed_figures.json     (figures 7 天去重)
      #   - state/last_13f.json           (Berkshire 13F 提交比对)
      #   - state/subject_cache.json      (主题日内幂等缓存)
      #   - state/subject_generation.log  (主题生成审计日志)
      #   - state/header_cache/           (刊头图本地缓存,避免 Pexels 重复请求)
      #   - .state/duan_last_seen.json    (段永平雪球已见 id 下限)
      #   - .state/last_mail_sent.json    (段永平时间下限)
      #   - .state/duan_health.json       (健康监控连续 streak)
      # 用 actions/cache 把这两个目录跨 run 持久化。
      # cache key 用 run_id 唯一(每次 save 都成功),restore-keys 用前缀回退到最近一次。
      - name: Restore state from previous run
        uses: actions/cache/restore@v4
        id: state-restore
        with:
          path: |
            state
            .state
          key: daily-state-${{ github.run_id }}
          restore-keys: |
            daily-state-

      - name: Send daily market brief
        run: uv run python src/main.py

      # 仅发送成功时保存 state,避免失败 run 也记录"已处理"导致未送达内容被跳过。
      # 注意:actions/cache/save 的 key 每天唯一,下一次 restore 回退到最近一次成功的 state。
      - name: Save state for next run
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            state
            .state
          key: daily-state-${{ github.run_id }}
