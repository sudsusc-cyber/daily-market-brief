name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: ruff lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies (含 dev group:ruff/black/pytest/pillow)
        run: uv sync --frozen --group dev

      - name: Run ruff
        run: uv run ruff check .

  test:
    name: pytest (3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies (含 dev group:pytest/pillow)
        run: uv sync --frozen --group dev

      - name: Run tests
        run: uv run pytest tests/ -q --ignore=tests/test_subject_dryrun.py
