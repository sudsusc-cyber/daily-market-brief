[project]
name = "daily-market-brief"
version = "0.1.0"
description = "每日市场+你 自动晨报系统"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "kaiyuan" }]

# 依赖按里程碑追加,后续 M3/M4/M5/M6 再补充
dependencies = [
    # M1 验证
    "yfinance>=0.2.40",
    "finnhub-python>=2.4.20",
    "feedparser>=6.0.11",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.0",
    "openai>=1.40.0",
    "python-dotenv>=1.0.1",
    # M2 MVP
    "pydantic-settings>=2.5.0",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "black>=24.0.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pillow>=12.2.0",
    "pytest>=9.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]
