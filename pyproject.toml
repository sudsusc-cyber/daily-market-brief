[project]
name = "daily-market-brief"
version = "0.1.0"
description = "每日市场+你 自动晨报系统"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "kaiyuan" }]

# 依赖按里程碑追加,后续 M3/M4/M5/M6 再补充
dependencies = [
    # M1 验证
    "yfinance>=0.2.40",
    "finnhub-python>=2.4.29",
    "feedparser>=6.0.11",
    "requests>=2.32.0",
    "urllib3>=2.7.0",
    "idna>=3.15",
    "beautifulsoup4>=4.12.3",
    "soupsieve>=2.8.4",
    "lxml>=5.2.0",
    "pypdf>=6.0.0",
    "openai>=1.40.0",
    "python-dotenv>=1.0.1",
    # M2 MVP
    "pydantic-settings>=2.14.2",
    "jinja2>=3.1.4",
    "ephem>=4.2.1",
    "brotli>=1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not dryrun'"
markers = ["dryrun: tests that make real LLM calls (excluded by default)"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 单一开发依赖来源(PEP 735)。之前同时存在 [project.optional-dependencies] dev
# 与 [dependency-groups] dev,两组内容/版本不同(pytest 8 vs 9),CI 用 --extra dev
# 走前者,本地 uv sync 走后者,容易踩坑。统一到 [dependency-groups]。
[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "black>=24.0.0",
    "pytest>=9.0.3",
    "pillow>=12.2.0",  # tests/test_header_image.py 验证图像写入需要
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# tests 里 MockClient/MockReturn 是 unittest.mock 惯用大写命名,豁免 N806
"tests/**/*.py" = ["N806"]

[tool.black]
line-length = 100
target-version = ["py311"]
